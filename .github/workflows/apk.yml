name: Fabriquer l'APK Bulle

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.bulle.chat","appName":"Bulle","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Garder une copie de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Bulle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Bulle.apk
          gh release delete apk-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest Bulle.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Bulle (APK Android)" --notes "APK de Bulle, reconstruit à chaque modification du dépôt."
