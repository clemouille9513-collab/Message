<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Bulle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232833;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;--acc:#6c8cff;--me:#3b5bdb;--ok:#2fbf71}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--txt)}
.hidden{display:none!important}
.mut{color:var(--mut)}
.screen{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;gap:12px}
.screen h1{font-size:34px}
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:13px 16px;font-weight:600;width:100%}
.btn.alt{background:var(--card2)}
#app{height:100dvh;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.bar h2{font-size:20px;flex:1}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font-size:18px}
.ttl small{color:var(--mut);font-size:12px}
.ib{width:40px;height:40px;border-radius:50%;font-size:20px;display:grid;place-items:center;background:var(--card2);flex:none}
#chatList,#mapPanel{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:active{background:var(--card)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#6c8cff,#3b5bdb);display:grid;place-items:center;font-weight:700;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid .last{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mut);font-size:12px}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
#fab{position:absolute;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--acc);font-size:28px;color:#fff;box-shadow:0 6px 18px #0008}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.older{align-self:center;background:var(--card2);color:var(--mut);padding:6px 14px;border-radius:14px;font-size:13px;margin-bottom:6px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;overflow-wrap:anywhere;white-space:pre-wrap;display:flex;flex-direction:column;gap:4px}
.msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.msg .time{font-size:11px;color:#ffffffa0;align-self:flex-end}
.thumb{max-width:100%;width:230px;border-radius:10px;cursor:pointer;display:block}
.player{max-width:100%;width:260px;border-radius:10px}
.locl{background:#0004;border-radius:10px;padding:10px 12px;color:#fff;text-decoration:none;display:block}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#msgInput{flex:1;background:var(--card2);border:0;border-radius:20px;padding:10px 14px;resize:none;max-height:120px;outline:none}
#emojiPanel{background:var(--card);border-top:1px solid var(--line);height:240px;display:flex;flex-direction:column}
#emojiTabs{display:flex;border-bottom:1px solid var(--line)}
#emojiTabs button{flex:1;padding:8px;font-size:20px}
#emojiTabs button.on{background:var(--card2)}
#emojiGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);padding:6px;gap:2px;align-content:start}
#emojiGrid button{font-size:26px;padding:4px;border-radius:8px}
#emojiGrid button:active{background:var(--card2)}
#nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:12px;color:var(--mut);font-size:14px}
#nav button.on{color:var(--acc);font-weight:600}
#map{flex:1;min-height:200px;background:#222}
#mapPanel{flex:none;max-height:46%}
.sec{padding:10px 14px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row small{color:var(--mut)}
.sw{width:46px;height:26px;accent-color:var(--acc);flex:none}
.pin{background:transparent;border:0}
.pin span{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);color:#fff;font-weight:700;border:2px solid #fff}
.pin span i{transform:rotate(45deg);font-style:normal}
.pin.me span{background:var(--ok)}
#lightbox{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:2000}
#lightbox img{max-width:96vw;max-height:92vh}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:2500}
.sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:20px}
textarea.code{background:var(--card2);border:0;border-radius:10px;padding:10px;width:100%;height:110px;font:12px monospace;word-break:break-all;resize:none}
.two{display:flex;gap:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3000;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="welcome" class="screen hidden">
  <h1>🫧 Bulle</h1>
  <p class="mut">Messages privés, photos, vidéos et position, directement de téléphone à téléphone, sans serveur ni compte.</p>
  <input id="nameInput" class="field" placeholder="Ton pseudo" maxlength="20" autocomplete="off">
  <button id="nameOk" class="btn">Commencer</button>
</div>

<div id="app" class="hidden">
  <section id="viewList" class="view">
    <div class="bar"><h2>Bulle</h2><button id="btnSettings" class="ib" title="Réglages">⚙️</button></div>
    <div id="chatList"></div>
    <button id="fab" title="Se connecter à un ami">＋</button>
  </section>

  <section id="viewChat" class="view hidden">
    <div class="bar">
      <button id="backBtn" class="ib">←</button>
      <div class="ttl" id="chatTitle"><b id="chatName"></b><small id="chatStatus"></small></div>
      <button id="toMap" class="ib" title="Voir la carte">🗺️</button>
    </div>
    <div id="msgs"></div>
    <div id="emojiPanel" class="hidden"><div id="emojiTabs"></div><div id="emojiGrid"></div></div>
    <div id="composer">
      <button id="btnEmoji" class="ib">😊</button>
      <button id="btnAttach" class="ib" title="Photo / vidéo">📎</button>
      <button id="btnLoc" class="ib" title="Envoyer ma position">📍</button>
      <textarea id="msgInput" rows="1" placeholder="Message" maxlength="4000"></textarea>
      <button id="btnSend" class="ib" style="background:var(--acc)">➤</button>
      <input id="fileInput" type="file" accept="image/*,video/*" class="hidden">
    </div>
  </section>

  <section id="viewMap" class="view hidden">
    <div class="bar"><h2>Carte</h2><button id="fitBtn" class="ib" title="Tout voir">⌖</button></div>
    <div id="map"></div>
    <div id="mapPanel"></div>
  </section>

  <nav id="nav">
    <button id="navList" class="on">💬 Discussions</button>
    <button id="navMap">🗺️ Carte</button>
  </nav>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="lightbox" class="hidden"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const show = (s, on = true) => $(s).classList.toggle('hidden', !on);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); kids.flat().forEach(k => e.append(k)); return e; };
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2800); }
const hm = d => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), n = new Date();
  return d.toDateString() === n.toDateString() ? hm(d) : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + hm(d);
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  return `il y a ${Math.floor(s / 3600)} h`;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- Identité ---------- */
const MY_UID = localStorage.getItem('bulle_uid') || (() => {
  const a = new Uint8Array(12); crypto.getRandomValues(a);
  const id = [...a].map(b => b.toString(16).padStart(2, '0')).join('');
  localStorage.setItem('bulle_uid', id); return id;
})();
let myName = localStorage.getItem('bulle_name') || '';

/* ---------- Stockage local (IndexedDB) : historique illimité ---------- */
const DB = new Promise((ok, ko) => {
  const r = indexedDB.open('bulle', 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore('contacts', { keyPath: 'id' });
    const m = d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
    m.createIndex('byChat', ['cid', 'id']);
  };
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
const rq = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
async function store(name, mode = 'readonly') { const d = await DB; return d.transaction(name, mode).objectStore(name); }
const allContacts = async () => rq((await store('contacts')).getAll());
const getContact = async id => rq((await store('contacts')).get(id));
const putContact = async c => rq((await store('contacts', 'readwrite')).put(c));
const addMsgDB = async m => rq((await store('messages', 'readwrite')).add(m));
async function lastMsgs(cid, before, limit) {
  const s = await store('messages');
  const range = IDBKeyRange.bound([cid, 0], [cid, before === Infinity ? Number.MAX_SAFE_INTEGER : before - 1]);
  return new Promise((ok, ko) => {
    const out = [], r = s.index('byChat').openCursor(range, 'prev');
    r.onsuccess = () => { const c = r.result; if (c && out.length < limit) { out.push(c.value); c.continue(); } else ok(out.reverse()); };
    r.onerror = () => ko(r.error);
  });
}
async function upsertContact(id, name) {
  const c = (await getContact(id)) || { id, ts: Date.now(), last: '' };
  c.name = name; await putContact(c); return c;
}
async function touchContact(id, last) {
  const c = await getContact(id); if (!c) return;
  c.last = last; c.ts = Date.now(); await putContact(c);
}

/* ---------- Écrans ---------- */
let cur = null;
function showView(v) {
  show('#viewList', v === 'list'); show('#viewChat', v === 'chat'); show('#viewMap', v === 'map');
  show('#nav', v !== 'chat');
  $('#navList').classList.toggle('on', v === 'list'); $('#navMap').classList.toggle('on', v === 'map');
  if (v === 'list') renderList();
  if (v === 'map') { initMap(); renderMapList(); setTimeout(() => { map && map.invalidateSize(); fitAll(); }, 80); }
}
$('#navList').onclick = () => showView('list');
$('#navMap').onclick = () => showView('map');
$('#toMap').onclick = () => { history.back(); setTimeout(() => showView('map'), 60); };
$('#backBtn').onclick = () => history.back();
window.addEventListener('popstate', () => { if (cur) { closeChat(); showView('list'); } });

function openModal(...nodes) { const s = $('#sheet'); s.replaceChildren(...nodes); show('#modal'); }
function closeModal() { show('#modal', false); $('#sheet').replaceChildren(); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function start() {
  if (!myName) { show('#welcome'); $('#nameInput').focus(); return; }
  show('#welcome', false); show('#app'); showView('list');
  if (localStorage.getItem('bulle_awake') === '1') setAwake(true);
  if (localStorage.getItem('bulle_live') === '1') setLive(true);
}
$('#nameOk').onclick = () => {
  const n = $('#nameInput').value.trim().slice(0, 20);
  if (n.length < 2) return toast('Pseudo trop court');
  myName = n; localStorage.setItem('bulle_name', n); start();
};
$('#nameInput').onkeydown = e => { if (e.key === 'Enter') $('#nameOk').click(); };

/* ---------- Liste des discussions ---------- */
async function renderList() {
  const box = $('#chatList'); box.replaceChildren();
  const arr = (await allContacts()).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!arr.length) { box.append(el('div', { className: 'empty', textContent: "Aucun ami pour l'instant. Appuie sur ＋ pour te connecter à quelqu'un." })); return; }
  arr.forEach(c => box.append(
    el('div', { className: 'item', onclick: () => openChat(c.id) },
      el('div', { className: 'av' + (conns.has(c.id) ? ' on' : ''), textContent: (c.name || '?')[0].toUpperCase() }),
      el('div', { className: 'mid' }, el('b', { textContent: c.name }), el('span', { className: 'last', textContent: c.last || (conns.has(c.id) ? 'En ligne' : 'Hors ligne') })),
      el('small', { textContent: fmtTime(c.ts) }))));
}
$('#fab').onclick = connectMenu;

/* ---------- Réglages ---------- */
$('#btnSettings').onclick = () => {
  const name = el('input', { className: 'field', value: myName, maxLength: 20 });
  const awake = el('input', { type: 'checkbox', className: 'sw', checked: localStorage.getItem('bulle_awake') === '1' });
  awake.onchange = () => setAwake(awake.checked);
  openModal(
    el('h3', { textContent: 'Réglages' }),
    el('label', { className: 'mut', textContent: 'Mon pseudo' }), name,
    el('div', { className: 'row', style: 'padding:6px 0;border:0' },
      el('div', { className: 'mid' }, el('b', { textContent: "Garder l'écran allumé" }), el('small', { textContent: "Évite que la connexion se coupe quand l'écran s'éteint" })), awake),
    el('button', { className: 'btn', textContent: 'Enregistrer', onclick: () => {
      const n = name.value.trim().slice(0, 20);
      if (n.length < 2) return toast('Pseudo trop court');
      myName = n; localStorage.setItem('bulle_name', n); closeModal(); toast('Pseudo enregistré');
    } }),
    el('button', { className: 'btn alt', textContent: 'Fermer', onclick: closeModal }));
};
let wl = null;
async function setAwake(on) {
  localStorage.setItem('bulle_awake', on ? '1' : '0');
  try {
    if (on) wl = await navigator.wakeLock.request('screen');
    else if (wl) { await wl.release(); wl = null; }
  } catch (e) { toast("Écran allumé non disponible sur ce navigateur"); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && localStorage.getItem('bulle_awake') === '1') setAwake(true); });

/* ---------- Connexion directe (WebRTC) ---------- */
const conns = new Map();   // uid de l'ami -> { pc, dc, name }
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let pending = null;

const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
async function encode(desc) {
  const txt = JSON.stringify({ type: desc.type, sdp: desc.sdp });
  if (window.CompressionStream) {
    const out = new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));
    return 'g.' + b64(await new Response(out).arrayBuffer());
  }
  return 'p.' + btoa(unescape(encodeURIComponent(txt)));
}
async function decode(code) {
  code = code.trim().replace(/\s+/g, '');
  if (code.startsWith('g.')) {
    const out = new Blob([unb64(code.slice(2))]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(out).text());
  }
  if (code.startsWith('p.')) return JSON.parse(decodeURIComponent(escape(atob(code.slice(2)))));
  throw new Error('code invalide');
}
function waitIce(pc) {
  return new Promise(ok => {
    if (pc.iceGatheringState === 'complete') return ok();
    const f = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', f); ok(); } };
    pc.addEventListener('icegatheringstatechange', f);
    setTimeout(ok, 6000);
  });
}
function newPC() {
  const pc = new RTCPeerConnection(ICE);
  pc.onconnectionstatechange = () => { if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) handleDrop(pc); };
  return pc;
}
function handleDrop(pc) {
  for (const [uid, c] of conns) {
    if (c.pc === pc) {
      conns.delete(uid); delete locs[uid];
      toast(c.name + " s'est déconnecté");
      renderList(); updateChatStatus(); renderMapList(); drawMarkers();
    }
  }
}
function wireDC(pc, dc) {
  dc.binaryType = 'arraybuffer'; dc.bufferedAmountLowThreshold = 262144;
  let peer = null, incoming = null, helloSent = false;
  const hello = () => { if (helloSent || dc.readyState !== 'open') return; helloSent = true; dc.send(JSON.stringify({ t: 'hello', uid: MY_UID, name: myName })); };
  dc.onopen = hello;
  dc.onclose = () => handleDrop(pc);
  dc.onmessage = async e => {
    if (typeof e.data !== 'string') { if (incoming) { incoming.got += e.data.byteLength; if (incoming.got <= incoming.size + 65536) incoming.parts.push(e.data); } return; }
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.t === 'hello') {
      peer = { uid: String(m.uid).slice(0, 40), name: String(m.name || 'ami').slice(0, 20) };
      const old = conns.get(peer.uid);
      if (old && old.pc !== pc) { try { old.pc.close(); } catch (err) {} }
      conns.set(peer.uid, { pc, dc, name: peer.name });
      pending = null;
      await upsertContact(peer.uid, peer.name);
      closeModal(); toast('Connecté à ' + peer.name);
      renderList(); updateChatStatus();
      if (liveOn && myPos) sendJSON(peer.uid, { t: 'live', lat: myPos[0], lng: myPos[1] });
      return;
    }
    if (!peer) return;
    if (m.t === 'msg') await receive(peer, { type: 'text', text: String(m.text).slice(0, 4000) }, String(m.text).slice(0, 60));
    else if (m.t === 'loc') await receive(peer, { type: 'loc', lat: +m.lat, lng: +m.lng }, '📍 Position');
    else if (m.t === 'filestart') {
      if (m.size > 60 * 1024 * 1024) { incoming = null; return; }
      incoming = { kind: m.kind === 'video' ? 'video' : 'image', mime: String(m.mime || ''), size: +m.size || 0, got: 0, parts: [] };
    } else if (m.t === 'fileend' && incoming) {
      const blob = new Blob(incoming.parts, { type: incoming.mime });
      await receive(peer, { type: incoming.kind, blob, mime: incoming.mime }, incoming.kind === 'video' ? '🎬 Vidéo' : '📷 Photo');
      incoming = null;
    } else if (m.t === 'live') {
      locs[peer.uid] = { lat: +m.lat, lng: +m.lng, ts: Date.now(), name: peer.name };
      renderMapList(); drawMarkers();
    } else if (m.t === 'liveoff') { delete locs[peer.uid]; renderMapList(); drawMarkers(); }
  };
  if (dc.readyState === 'open') hello();
}
async function receive(peer, data, preview) {
  const rec = { cid: peer.uid, from: 'them', ts: Date.now(), ...data };
  rec.id = await addMsgDB(rec);
  await touchContact(peer.uid, preview);
  if (cur && cur.uid === peer.uid) appendBubble(rec, 'end');
  else { toast('💬 ' + peer.name + ' : ' + preview); if (navigator.vibrate) navigator.vibrate(80); }
  renderList();
}
function sendJSON(uid, obj) {
  const c = conns.get(uid);
  if (!c || c.dc.readyState !== 'open') return false;
  c.dc.send(JSON.stringify(obj)); return true;
}
function broadcast(obj) { for (const uid of conns.keys()) sendJSON(uid, obj); }

/* Menu de connexion : on s'échange deux codes */
function copyBtn(code) {
  return el('div', { className: 'two' },
    el('button', { className: 'btn alt', textContent: 'Copier', onclick: async () => { try { await navigator.clipboard.writeText(code); toast('Code copié'); } catch (e) { toast('Sélectionne le code et copie-le à la main'); } } }),
    navigator.share ? el('button', { className: 'btn alt', textContent: 'Partager', onclick: () => navigator.share({ text: code }).catch(() => {}) }) : '');
}
function cancelPending() { if (pending) { try { pending.close(); } catch (e) {} pending = null; } }
function connectMenu() {
  cancelPending();
  openModal(
    el('h3', { textContent: 'Se connecter à un ami' }),
    el('p', { className: 'mut', textContent: "Vous avez besoin d'être tous les deux en ligne. L'un crée un code et l'envoie à l'autre (SMS, WhatsApp…), l'autre répond avec son propre code." }),
    el('button', { className: 'btn', textContent: '1 · Je crée un code', onclick: startOffer }),
    el('button', { className: 'btn alt', textContent: "2 · J'ai reçu un code", onclick: startAnswer }),
    el('button', { className: 'btn alt', textContent: 'Fermer', onclick: closeModal }));
}
async function startOffer() {
  cancelPending();
  openModal(el('h3', { textContent: 'Création du code…' }));
  try {
    const pc = newPC(); pending = pc;
    wireDC(pc, pc.createDataChannel('bulle'));
    await pc.setLocalDescription(await pc.createOffer());
    await waitIce(pc);
    const code = await encode(pc.localDescription);
    const answer = el('textarea', { className: 'code', placeholder: 'Colle ici le code de réponse de ton ami' });
    openModal(
      el('h3', { textContent: '1 · Envoie ce code à ton ami' }),
      el('textarea', { className: 'code', readOnly: true, value: code, onclick: e => e.target.select() }),
      copyBtn(code),
      el('h3', { textContent: '2 · Colle sa réponse' }), answer,
      el('button', { className: 'btn', textContent: 'Connecter', onclick: async () => {
        try { await pc.setRemoteDescription(await decode(answer.value)); toast('Connexion en cours…'); }
        catch (e) { toast('Code invalide, recopie-le en entier'); }
      } }),
      el('button', { className: 'btn alt', textContent: 'Annuler', onclick: () => { cancelPending(); closeModal(); } }));
  } catch (e) { toast('Impossible de créer le code'); closeModal(); }
}
function startAnswer() {
  cancelPending();
  const offer = el('textarea', { className: 'code', placeholder: 'Colle ici le code reçu' });
  openModal(
    el('h3', { textContent: 'Colle le code de ton ami' }), offer,
    el('button', { className: 'btn', textContent: 'Valider', onclick: async () => {
      let desc; try { desc = await decode(offer.value); } catch (e) { return toast('Code invalide, recopie-le en entier'); }
      openModal(el('h3', { textContent: 'Création de ta réponse…' }));
      try {
        const pc = newPC(); pending = pc;
        pc.ondatachannel = ev => wireDC(pc, ev.channel);
        await pc.setRemoteDescription(desc);
        await pc.setLocalDescription(await pc.createAnswer());
        await waitIce(pc);
        const code = await encode(pc.localDescription);
        openModal(
          el('h3', { textContent: 'Envoie cette réponse à ton ami' }),
          el('textarea', { className: 'code', readOnly: true, value: code, onclick: e => e.target.select() }),
          copyBtn(code),
          el('p', { className: 'mut', textContent: "Dès qu'il l'aura collée et validée, vous serez connectés. Laisse cet écran ouvert." }),
          el('button', { className: 'btn alt', textContent: 'Annuler', onclick: () => { cancelPending(); closeModal(); } }));
      } catch (e) { toast('Code invalide'); closeModal(); }
    } }),
    el('button', { className: 'btn alt', textContent: 'Annuler', onclick: closeModal }));
}

/* ---------- Conversation ---------- */
async function openChat(uid) {
  const c = await getContact(uid); if (!c) return;
  closeChat();
  cur = { uid, name: c.name, firstId: null };
  $('#chatName').textContent = c.name;
  updateChatStatus();
  $('#msgs').replaceChildren(el('button', { className: 'older', id: 'olderBtn', textContent: 'Charger les messages plus anciens', onclick: loadOlder }));
  show('#emojiPanel', false);
  showView('chat');
  history.pushState({ c: 1 }, '');
  const arr = await lastMsgs(uid, Infinity, 50);
  arr.forEach(m => appendBubble(m, 'end'));
  if (arr.length < 50) $('#olderBtn').remove();
  const box = $('#msgs'); box.scrollTop = box.scrollHeight;
}
function closeChat() { cur = null; }
function updateChatStatus() {
  if (!cur) return;
  const on = conns.has(cur.uid), s = $('#chatStatus');
  s.textContent = on ? '● En ligne' : '○ Hors ligne — appuie ici pour te reconnecter';
  s.style.color = on ? 'var(--ok)' : 'var(--mut)';
}
$('#chatTitle').onclick = () => { if (cur && !conns.has(cur.uid)) connectMenu(); };
async function loadOlder() {
  if (!cur || !cur.firstId) return;
  const box = $('#msgs'), before = box.scrollHeight;
  const arr = await lastMsgs(cur.uid, cur.firstId, 50);
  arr.reverse().forEach(m => appendBubble(m, 'start'));
  if (arr.length < 50) { const b = $('#olderBtn'); if (b) b.remove(); }
  box.scrollTop = box.scrollHeight - before;
}
function appendBubble(m, where) {
  if (!cur || m.cid !== cur.uid) return;
  if (!cur.firstId || m.id < cur.firstId) cur.firstId = m.id;
  const box = $('#msgs'), node = bubble(m);
  if (where === 'start') { const ob = $('#olderBtn'); ob ? ob.after(node) : box.prepend(node); }
  else {
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
    box.append(node);
    if (near || m.from === 'me') box.scrollTop = box.scrollHeight;
  }
}
function bubble(m) {
  const d = el('div', { className: 'msg ' + (m.from === 'me' ? 'me' : 'them') });
  if (m.type === 'image' && m.blob) {
    const url = URL.createObjectURL(m.blob);
    d.append(el('img', { className: 'thumb', src: url, onclick: () => { const lb = $('#lightbox'); lb.replaceChildren(el('img', { src: url })); lb.onclick = () => show('#lightbox', false); show('#lightbox'); } }));
  } else if (m.type === 'video' && m.blob) {
    d.append(el('video', { className: 'player', controls: true, playsInline: true, preload: 'metadata', src: URL.createObjectURL(m.blob) }));
  } else if (m.type === 'loc') {
    d.append(el('a', { className: 'locl', target: '_blank', rel: 'noopener', href: `https://www.openstreetmap.org/?mlat=${m.lat}&mlon=${m.lng}#map=17/${m.lat}/${m.lng}`, textContent: '📍 Position partagée\nOuvrir sur la carte' }));
  } else d.append(document.createTextNode(m.text || ''));
  d.append(el('span', { className: 'time', textContent: fmtTime(m.ts) }));
  return d;
}

/* ---------- Envoi ---------- */
async function saveSent(data, preview) {
  const rec = { cid: cur.uid, from: 'me', ts: Date.now(), ...data };
  rec.id = await addMsgDB(rec);
  await touchContact(cur.uid, preview);
  appendBubble(rec, 'end');
}
function needOnline() {
  if (cur && conns.has(cur.uid) && conns.get(cur.uid).dc.readyState === 'open') return true;
  toast('Hors ligne : reconnecte-toi avec ' + (cur ? cur.name : 'ton ami')); return false;
}
async function sendText() {
  const t = $('#msgInput').value.trim();
  if (!t || !needOnline()) return;
  sendJSON(cur.uid, { t: 'msg', text: t });
  $('#msgInput').value = ''; autoGrow();
  await saveSent({ type: 'text', text: t }, t.slice(0, 60));
}
$('#btnSend').onclick = sendText;
$('#msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); sendText(); }
});
function autoGrow() { const t = $('#msgInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('#msgInput').addEventListener('input', autoGrow);
$('#msgInput').addEventListener('focus', () => show('#emojiPanel', false));

$('#btnLoc').onclick = () => {
  if (!needOnline()) return;
  if (!navigator.geolocation) return toast('Localisation non disponible');
  toast('Recherche de ta position…');
  navigator.geolocation.getCurrentPosition(async p => {
    if (!needOnline()) return;
    const lat = p.coords.latitude, lng = p.coords.longitude;
    sendJSON(cur.uid, { t: 'loc', lat, lng });
    await saveSent({ type: 'loc', lat, lng }, '📍 Position');
  }, () => toast('Position refusée : autorise la localisation'), { enableHighAccuracy: true, timeout: 15000 });
};

$('#btnAttach').onclick = () => { if (needOnline()) $('#fileInput').click(); };
$('#fileInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !cur || !needOnline()) return;
  try {
    if (f.type.startsWith('image/')) {
      const blob = await imgToBlob(f, 1280, 0.78);
      await sendFile(cur.uid, blob, 'image');
      await saveSent({ type: 'image', blob, mime: blob.type }, '📷 Photo');
    } else if (f.type.startsWith('video/')) {
      if (f.size > 30 * 1024 * 1024) return toast('Vidéo trop lourde (30 Mo max).');
      await sendFile(cur.uid, f, 'video');
      await saveSent({ type: 'video', blob: f, mime: f.type }, '🎬 Vidéo');
    } else toast('Choisis une photo ou une vidéo.');
  } catch (err) { toast('Envoi interrompu : ' + (err.message || 'erreur')); }
};
function imgToBlob(f, max, q) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : ko(new Error('image illisible')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('image illisible')); };
    img.src = url;
  });
}
async function sendFile(uid, blob, kind) {
  const c = conns.get(uid);
  if (!c || c.dc.readyState !== 'open') throw new Error('hors ligne');
  const dc = c.dc, buf = await blob.arrayBuffer(), CH = 16384;
  dc.send(JSON.stringify({ t: 'filestart', kind, mime: blob.type, size: buf.byteLength }));
  let lastPct = 0;
  for (let o = 0; o < buf.byteLength; o += CH) {
    if (dc.readyState !== 'open') throw new Error('connexion perdue');
    if (dc.bufferedAmount > 1048576) await new Promise(r => dc.addEventListener('bufferedamountlow', r, { once: true }));
    dc.send(buf.slice(o, o + CH));
    const pct = Math.floor(o / buf.byteLength * 10) * 10;
    if (pct > lastPct && buf.byteLength > 600000) { lastPct = pct; toast('Envoi… ' + pct + '%'); }
  }
  dc.send(JSON.stringify({ t: 'fileend' }));
}

const tabs = $('#emojiTabs'), grid = $('#emojiGrid');
function showCat(k) {
  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
  grid.replaceChildren(...EMOJIS[k].split(' ').map(e => el('button', { textContent: e, onclick: () => insertEmoji(e) })));

Object.keys(EMOJIS).forEach(k => { const b = el('button', { textContent: k, onclick: () => showCat(k) }); b.dataset.k = k; tabs.append(b); });
showCat('😀');

  const t = $('#msgInput'), s = t.selectionStart ?? t.value.length, en = t.selectionEnd ?? s;
  t.value = t.value.slice(0, s) + e + t.value.slice(en);
  t.selectionStart = t.selectionEnd = s + e.length; autoGrow();
}
$('#btnEmoji').onclick = () => { const p = $('#emojiPanel'); p.classList.toggle('hidden'); if (!p.classList.contains('hidden')) document.activeElement.blur(); };

/* ---------- Carte et position en direct ---------- */
let map = null, mapReady = false, liveOn = false, geoId = null, myPos = null, lastSent = 0;
const locs = {}, markers = {};

function initMap() {
  if (mapReady) return;
  if (typeof L === 'undefined') { toast('Carte indisponible (pas de connexion ?)'); return; }
  map = L.map('map', { zoomControl: false }).setView([46.6, 2.5], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  mapReady = true; drawMarkers();
}
const pin = (letter, isMe) => L.divIcon({ className: 'pin' + (isMe ? ' me' : ''), html: `<span><i>${letter}</i></span>`, iconSize: [34, 34], iconAnchor: [17, 34] });
function drawMarkers() {
  if (!mapReady) return;
  const want = {};
  if (liveOn && myPos) want.me = { lat: myPos[0], lng: myPos[1], name: 'Moi', me: true };
  Object.entries(locs).forEach(([uid, v]) => { want[uid] = { lat: v.lat, lng: v.lng, name: v.name }; });
  Object.keys(markers).forEach(k => { if (!want[k]) { map.removeLayer(markers[k]); delete markers[k]; } });
  Object.entries(want).forEach(([k, v]) => {
    if (markers[k]) markers[k].setLatLng([v.lat, v.lng]);
    else markers[k] = L.marker([v.lat, v.lng], { icon: pin((v.name || '?')[0].toUpperCase(), v.me) }).addTo(map).bindPopup(v.name);
  });
}
function fitAll() {
  if (!mapReady) return;
  const pts = Object.values(markers).map(m => m.getLatLng());
  if (pts.length === 1) map.setView(pts[0], 15);
  else if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [50, 50] });
}
$('#fitBtn').onclick = fitAll;

function renderMapList() {
  const box = $('#mapPanel'); box.replaceChildren();
  const live = el('input', { type: 'checkbox', className: 'sw', checked: liveOn });
  live.onchange = () => setLive(live.checked);
  box.append(el('div', { className: 'sec', textContent: 'Ma position' }),
    el('div', { className: 'row' }, el('div', { className: 'mid' }, el('b', { textContent: 'Partager en direct' }), el('small', { textContent: "Visible par les amis connectés, tant que l'appli est ouverte" })), live),
    el('div', { className: 'sec', textContent: 'Position des amis' }));
  const list = Object.entries(locs);
  if (!list.length) box.append(el('div', { className: 'empty', textContent: "Aucun ami connecté ne partage sa position pour l'instant." }));
  list.forEach(([uid, v]) => box.append(
    el('div', { className: 'row', onclick: () => { if (markers[uid]) { map.setView(markers[uid].getLatLng(), 16); markers[uid].openPopup(); } } },
      el('div', { className: 'av', textContent: (v.name || '?')[0].toUpperCase() }),
      el('div', { className: 'mid' }, el('b', { textContent: v.name }), el('small', { textContent: 'Mis à jour ' + ago(v.ts) })))));
}
setInterval(() => { if (!$('#viewMap').classList.contains('hidden')) renderMapList(); }, 30000);

function setLive(on) {
  localStorage.setItem('bulle_live', on ? '1' : '0');
  if (on) {
    if (geoId != null) return;
    if (!navigator.geolocation) { toast('Localisation non disponible'); return; }
    liveOn = true;
    geoId = navigator.geolocation.watchPosition(p => {
      myPos = [p.coords.latitude, p.coords.longitude]; drawMarkers();
      const n = Date.now();
      if (n - lastSent > 5000) { lastSent = n; broadcast({ t: 'live', lat: myPos[0], lng: myPos[1] }); }
    }, () => {
      toast('Position refusée : autorise la localisation pour Bulle.');
      setLive(false); renderMapList();
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  } else {
    if (geoId != null && navigator.geolocation) navigator.geolocation.clearWatch(geoId);
    const was = liveOn; geoId = null; myPos = null; liveOn = false;
    if (was) broadcast({ t: 'liveoff' });
    drawMarkers();
  }
}

start();
